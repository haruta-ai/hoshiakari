<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星灯りの勇者 Ver.0.3α</title><link rel="stylesheet" href="style.css"></head><body>
<main><section id="title" class="screen"><div class="panel"><small>Ver.0.3α</small><h1>星灯りの勇者</h1><p>もう一度、剣を取る夜。</p><button id="new">はじめから</button><button id="cont">つづきから</button></div></section>
<section id="game" class="screen hidden"><header><span>星見村</span><span>目的：<b id="goal">村長に話を聞こう</b></span></header><div class="frame"><canvas id="cv" width="512" height="384"></canvas><div id="msg" class="msg hidden"><b id="sp"></b><p id="tx"></p><i>▼</i></div></div><div class="controls"><div class="pad"><button data-d="up">▲</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div><button id="act" class="act">話す<br><small>決定</small></button></div><div class="bottom"><button id="save">セーブ</button><button id="back">タイトルへ</button></div></section></main><script src="game.js"></script></body></html>
