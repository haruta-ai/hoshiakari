<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星灯りの勇者 Ver.0.3α</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
<section id="title" class="screen">
<div class="panel">
<p class="ver">Ver.0.3α</p><h1>星灯りの勇者</h1><p>もう一度、剣を取る夜。</p>
<button id="newGame">はじめから</button>
<button id="continueGame">つづきから</button>
<small>PC：矢印キー / WASD　決定：Enter / Space</small>
</div>
</section>
<section id="game" class="screen hidden">
<header><span>星見村</span><span>目的：<b id="objective">村長に話を聞こう</b></span></header>
<div class="frame"><canvas id="canvas" width="512" height="384"></canvas>
<div id="message" class="message hidden"><b id="speaker"></b><p id="text"></p><i>▼</i></div></div>
<div class="controls">
<div class="dpad">
<button data-dir="up" class="up">▲</button><button data-dir="left" class="left">◀</button><button data-dir="down" class="down">▼</button><button data-dir="right" class="right">▶</button>
</div>
<button id="action" class="action">話す<br><small>決定</small></button>
</div>
<footer><button id="save">セーブ</button><button id="back">タイトルへ</button></footer>
</section>
</main>
<script src="game.js"></script>
</body>
</html>
